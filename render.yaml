# Our Money Hub on Render — created by Arnold Rurangwa / Arnova Group.
# Two Free web services in Frankfurt. The database is a separate Neon
# Postgres project (not Render Postgres). Set DATABASE_URL in the
# Dashboard / MCP from the Neon connection string; do not commit it.
# Region: Frankfurt. Do not commit secrets.

services:
  - type: web
    name: arnova-omh-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_DOCS_ENABLED
        value: "false"
      - key: REGISTRATION_MODE
        value: closed
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: RATES_AUTO_SYNC
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: OMH_SECRET_KEY
        generateValue: true
      - key: OMH_FIELD_KEY
        generateValue: true
      - key: OMH_OWNER_SETUP_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://arnova-omh.onrender.com
      - key: CORS_ORIGINS
        value: https://arnova-omh.onrender.com

  - type: web
    name: arnova-omh
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: OMH_API_INTERNAL_URL
        value: https://arnova-omh-api.onrender.com
