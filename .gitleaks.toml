[extend]
useDefault = true

[allowlist]
description = "Build output, local env, and test HMAC fixtures are not production secrets"
paths = [
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-output/''',
  '''(^|/)\.env$''',
  '''(^|/)\.env\..*''',
  '''(^|/)backend/tests/test_contract.py$''',
]

[[rules]]
id = "apple-p8-private-key"
description = "Apple .p8 private key (Sign In / APNs)"
regex = '''-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----'''
path = '''(?i)\.p8$'''
tags = ["key", "apple"]

[[rules]]
id = "google-client-secret-json"
description = "Google OAuth client_secret JSON file"
regex = '''"client_secret"\s*:\s*"[^"]+"'''
path = '''(?i)(^|/)client_secret[^/]*\.json$'''
tags = ["key", "google"]
