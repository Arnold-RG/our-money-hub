[project]
name = "our-money-hub-api"
version = "2.0.0"
description = "Our Money Hub v2 API — the financial engine of Arnova Group. Created by Arnold Rurangwa / Arnova Group."
authors = [{ name = "Arnold Rurangwa" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "argon2-cffi>=25.1.0",
  "pyotp>=2.12.1",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]  # FastAPI Depends() defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E501"]
