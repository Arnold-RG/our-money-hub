[project]
name = "our-money-hub-api"
version = "2.0.0"
description = "Our Money Hub v2 API — the financial engine of Arnova Group. Created by Arnold Rurangwa / Arnova Group."
authors = [{ name = "Arnold Rurangwa" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
